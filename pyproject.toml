[project]
name = "indian-alpha"
version = "0.1.0"
description = "AI-powered, agentic, market-wide Indian equity opportunity discovery and quant decision-support platform (NSE/BSE)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "nagasaipradhyumnapoola" }]

dependencies = [
    # API / async
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "redis>=5.0",
    # data
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=0.10",
    "pyarrow>=15.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    # ml
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "apps"]
