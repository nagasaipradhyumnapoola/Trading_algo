[project]
name = "indian-alpha"
version = "0.1.0"
description = "AI-powered, agentic, market-wide Indian equity opportunity discovery and quant decision-support platform (NSE/BSE)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
authors = [{ name = "nagasaipradhyumnapoola" }]

# Core = exactly what the code imports today. Installs cleanly on 3.12 (target) and
# 3.14. Heavy/optional engines live in extras so the base env stays reproducible.
dependencies = [
    # API / async
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "redis>=5.0",
    # data
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # ml
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]          # real Postgres/TimescaleDB deployment
boost = ["lightgbm>=4.3", "xgboost>=2.0"]    # gradient-boosted models (Phase: quant)
research = ["duckdb>=0.10"]                   # DuckDB research/backtesting layer
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E741"]        # allow short names (l) in comprehensions

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E702", "E731"]        # terse test fixtures: inline setup, small lambdas

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
# Type-check is available (`mypy services apps`) but not yet a blocking gate;
# the codebase is not fully annotated. Tightened in a later hardening phase.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "apps"]
